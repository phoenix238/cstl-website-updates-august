name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build preview (clean URLs + rewrite root-absolute paths for the project subpath)
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          mkdir _site
          cp index.html _site/index.html
          for f in *.html; do
            [ "$f" = "index.html" ] && continue
            name="${f%.html}"
            mkdir -p "_site/$name"
            cp "$f" "_site/$name/index.html"
          done
          cp -r photos favicon*.png favicon.ico apple-touch-icon.png robots.txt sitemap.xml site.webmanifest _site/
          find _site -name "*.html" -exec sed -i -E "s#(href|src)=\"/#\1=\"/${REPO_NAME}/#g" {} +

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
