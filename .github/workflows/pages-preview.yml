name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build preview (rewrite root-absolute paths for the project subpath)
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          mkdir _site
          cp -r *.html photos favicon*.png favicon.ico apple-touch-icon.png robots.txt sitemap.xml site.webmanifest _site/
          sed -i -E "s#(href|src)=\"/#\1=\"/${REPO_NAME}/#g" _site/*.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
